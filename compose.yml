services:
  cloudflared:
    image: cloudflare/cloudflared:2026.10.1   # pin a version
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
      TUNNEL_TRANSPORT_PROTOCOL: http2
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway" # lets ssh:// ingress reach the host's sshd
    networks: [tunnel]

networks:
  tunnel:
    external: true
